name: Build CLI2API maintenance image

on:
  push:
    branches: [maintenance/v0.7.12-gruffwy]
  workflow_dispatch:
    inputs:
      updater_assets_only:
        description: Build updater assets from the existing release tag without publishing an image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cli2api-maintenance-v0.7.12
  cancel-in-progress: false

env:
  RELEASE_VERSION: v0.7.12-gruffwy.2

jobs:
  go:
    if: ${{ !inputs.updater_assets_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import constraints
        run: go test ./internal/app -run 'TestImportConstraints|TestDutyBoundaries' -count=1
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Validate bilingual changelog
        run: |
          python3 scripts/release-notes.py self-test
          python3 scripts/release-notes.py validate

  worker:
    if: ${{ !inputs.updater_assets_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker

  frontend:
    if: ${{ !inputs.updater_assets_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify embedded console
        run: |
          npm run sync
          git diff --exit-code -- ../internal/webui/static
        working-directory: frontend

  secrets:
    if: ${{ !inputs.updater_assets_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact

  updater-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.updater_assets_only && format('refs/tags/{0}', env.RELEASE_VERSION) || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve updater source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build updater assets and verify checksums
        env:
          APP_VERSION: ${{ env.RELEASE_VERSION }}
          APP_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          bash scripts/build-updater-assets.sh
          cd dist/updater
          sha256sum --check cli2api-updater_checksums.txt
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-updater-assets
          path: dist/updater/cli2api-updater_*
          if-no-files-found: error
          retention-days: 7

  image:
    if: ${{ !inputs.updater_assets_only }}
    needs: [go, worker, frontend, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to overwrite a published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_VERSION" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$RELEASE_VERSION" <<< "$existing_refs"; then
            echo "Release tag $RELEASE_VERSION already exists; bump RELEASE_VERSION or use updater_assets_only."
            exit 1
          fi
      - name: Set immutable image tags
        id: image
        shell: bash
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ github.repository }}:maintenance-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.RELEASE_VERSION }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: ${{ !inputs.updater_assets_only }}
    needs: [image, updater-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-updater-assets
          path: dist/updater
      - name: Publish maintenance release without moving official aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "CLI2API $RELEASE_VERSION" \
            --notes-file changelog/unreleased/downstream-provider-compatibility-v0712.md --latest=false \
            dist/updater/cli2api-updater_*

  supplement-updater-assets:
    if: ${{ inputs.updater_assets_only }}
    needs: updater-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-updater-assets
          path: dist/updater
      - name: Attach updater assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.updater-assets.outputs.source-sha }}
        run: |
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq .sha)"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          cd dist/updater
          sha256sum --check cli2api-updater_checksums.txt
          gh release upload "$RELEASE_VERSION" cli2api-updater_* --repo "$GITHUB_REPOSITORY"
